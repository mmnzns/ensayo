name: Release

# Push a tag like v0.2.0 (it must match "version" in src-tauri/tauri.conf.json). This makes a DRAFT release in the
# public releases repo (repo variable RELEASE_REPO, default mmnzns/ensayo-releases; the Ensayo repo is private, and
# the automatic updater can only read public downloads) and uploads to it:
#   Windows:       Ensayo_<v>_x64-setup.exe and its .sig
#   Mac (Apple):   Ensayo_<v>_aarch64.dmg, Ensayo_<v>_aarch64.app.tar.gz and its .sig
#   Mac (Intel):   Ensayo_<v>_x64.dmg, Ensayo_<v>_x64.app.tar.gz and its .sig
#   latest.json:   built by scripts/latest-json.mjs from every .sig, after all three builds finished
# Publish the draft by hand, in the public repo, after trying the installers (docs/RELEASE.md). Until it is
# published the updater doesn't see it (latest/download only serves published releases).
# Nothing here is signed with a paid certificate: testers get one-time steps in INSTALL.md.
#
# Secrets:
#   RELEASES_TOKEN                          fine-grained token with contents:write on RELEASE_REPO only
#   TAURI_SIGNING_PRIVATE_KEY / _PASSWORD   Ensayo's updater key (~/.tauri/ensayo.key; the password is empty)
#   APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY   optional, Mac jobs
# With the Apple secrets the Mac app keeps its microphone permission across updates; without them it is ad-hoc signed
# and macOS asks for the microphone again after each new version.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_REPO: ${{ vars.RELEASE_REPO || 'mmnzns/ensayo-releases' }}

jobs:
  draft:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version matches the tag
        run: |
          want="${GITHUB_REF_NAME#v}"
          have=$(node -p "require('./src-tauri/tauri.conf.json').version")
          [ "$want" = "$have" ] || { echo "::error::tag $GITHUB_REF_NAME but tauri.conf.json says $have"; exit 1; }
      - name: Draft release for this tag, in the public repo (once)
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          [ -n "$GH_TOKEN" ] || { echo "::error::the RELEASES_TOKEN secret is missing (docs/RELEASE.md, One-time setup)"; exit 1; }
          gh release view "$GITHUB_REF_NAME" --repo "$RELEASE_REPO" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --repo "$RELEASE_REPO" --draft --title "Ensayo $GITHUB_REF_NAME" --notes-file scripts/release-notes.md

  windows:
    needs: draft
    if: github.event_name == 'push'
    runs-on: windows-latest
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-windows
      - run: npm ci
      # The built-in local AI helper must exist before the app builds (tauri.conf.json externalBin).
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-llm-helper.ps1
      # Whisper and llama.cpp must be built for the AVX2 baseline, not this runner's CPU. The signing key makes the
      # installer's .sig (tauri.conf.json: bundle.createUpdaterArtifacts).
      - name: Build the installer
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          . ./scripts/cpu-baseline.ps1
          npm run tauri build -- --bundles nsis
          $bad = @(Get-GgmlCaches src-tauri/target | ForEach-Object { Test-GgmlBaseline $_ })
          if ($bad.Count -gt 0) { Write-Error "whisper.cpp or llama.cpp was not built for the baseline: $bad"; exit 1 }
      - name: Upload to the draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          v="${GITHUB_REF_NAME#v}"; out=src-tauri/target/release/bundle/nsis
          gh release upload "$GITHUB_REF_NAME" --repo "$RELEASE_REPO" "$out/Ensayo_${v}_x64-setup.exe" "$out/Ensayo_${v}_x64-setup.exe.sig" --clobber

  macos:
    needs: draft
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-latest is Apple silicon. The Intel build runs on an Intel runner (no cross-compiling of
          # whisper.cpp and llama.cpp); if that label is retired, use another x86_64 macOS label.
          - { os: macos-latest, target: aarch64-apple-darwin, arch: aarch64 }
          - { os: macos-15-intel, target: x86_64-apple-darwin, arch: x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-${{ matrix.arch }}
      - run: npm ci
      # Builds ensayo-llm for this runner's own architecture (the helper script uses the host triple).
      - run: sh scripts/build-llm-helper.sh
      - name: Build the app, the disk image and the updater package
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles app,dmg
      - name: Upload to the draft
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          v="${GITHUB_REF_NAME#v}"; out="src-tauri/target/${{ matrix.target }}/release/bundle"
          # The package is Ensayo.app.tar.gz whatever the architecture: name it so the two Macs don't collide.
          cp "$out/macos/Ensayo.app.tar.gz" "$out/Ensayo_${v}_${{ matrix.arch }}.app.tar.gz"
          cp "$out/macos/Ensayo.app.tar.gz.sig" "$out/Ensayo_${v}_${{ matrix.arch }}.app.tar.gz.sig"
          gh release upload "$GITHUB_REF_NAME" --repo "$RELEASE_REPO" \
            "$out/dmg/Ensayo_${v}_${{ matrix.arch }}.dmg" \
            "$out/Ensayo_${v}_${{ matrix.arch }}.app.tar.gz" \
            "$out/Ensayo_${v}_${{ matrix.arch }}.app.tar.gz.sig" --clobber

  # After all three builds: latest.json from every .sig on the draft (what the updater reads once it is published).
  updater-json:
    needs: [windows, macos]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/latest-json.check.mjs
      - env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: node scripts/latest-json.mjs "$GITHUB_REF_NAME"

  # Run by hand (Actions, Release, Run workflow) to check that both installers build, without making a release.
  # Needs the signing secrets: the build makes updater signatures.
  test-build:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: test-build-${{ matrix.os }}
      - run: npm ci
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/build-llm-helper.ps1
          . ./scripts/cpu-baseline.ps1
          npm run tauri build -- --bundles nsis
      - name: Mac disk image
        if: runner.os == 'macOS'
        run: |
          sh scripts/build-llm-helper.sh
          npm run tauri build -- --bundles app,dmg
      - uses: actions/upload-artifact@v4
        with:
          name: ensayo-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.tar.gz
            src-tauri/target/release/bundle/macos/*.sig
          if-no-files-found: error
