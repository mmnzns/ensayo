name: Release

# Push a tag like v0.2.0 (it must match "version" in src-tauri/tauri.conf.json). This makes a DRAFT release in this
# repo (the Ensayo repo is public, and the automatic updater can only read public downloads) and uploads to it:
#   Windows:       Ensayo_<v>_x64-setup.exe and its .sig
#   Mac (Apple):   Ensayo_<v>_aarch64.dmg, Ensayo_<v>_aarch64.app.tar.gz and its .sig
#   latest.json:   built by scripts/latest-json.mjs from every .sig, after both builds finished
# No Intel Mac build: ONNX Runtime (ort, used for voice detection and Parakeet) has no prebuilt x86_64-apple-darwin
# binaries, so it fails to build there (v0.1.0). Talaan is Apple silicon only for the same reason.
# Publish the draft by hand, on this repo's Releases page, after trying the installers (docs/RELEASE.md). Until it is
# published the updater doesn't see it (latest/download only serves published releases).
# Nothing here uses a paid certificate: the Mac is signed with the free self-signed one, Windows is unsigned, and
# testers get one-time steps in INSTALL.md.
#
# The local AI helpers (ensayo-llm, and ensayo-llm-vulkan on Windows) are NOT built in the app jobs: the `helpers` job
# calls voice-engine's reusable workflow at the engine tag (keep it equal to the tag in src-tauri/Cargo.toml), and the
# app jobs download its `helpers-<triple>` artifact into src-tauri/binaries. The app jobs pass `--config` with a
# `beforeBuildCommand` that only builds the frontend, so scripts/build-llm-helper.* cannot overwrite those files.
# The manual run (workflow_dispatch) builds like a release: the `helpers` job runs too, and `test-build` downloads and
# checks the same artifact and builds with the same release-only `--config`, so its Windows installer has the Vulkan
# graphics-card helper. Only dev and ci.yml still build the helper from this repo with scripts/build-llm-helper.*.
#
# Secrets:
#   TAURI_SIGNING_PRIVATE_KEY / _PASSWORD   Ensayo's updater key (~/.tauri/ensayo.key; the password is empty)
#   APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY   optional, Mac jobs
# With the Apple secrets the Mac app keeps its microphone permission across updates; without them it is ad-hoc signed
# and macOS asks for the microphone again after each new version.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_REPO: ${{ github.repository }}

jobs:
  draft:
    if: github.event_name == 'push'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version matches the tag
        run: |
          want="${GITHUB_REF_NAME#v}"
          have=$(node -p "require('./src-tauri/tauri.conf.json').version")
          [ "$want" = "$have" ] || { echo "::error::tag $GITHUB_REF_NAME but tauri.conf.json says $have"; exit 1; }
      - name: Draft release for this tag, in the public repo (once)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$RELEASE_REPO" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --repo "$RELEASE_REPO" --draft --title "Ensayo $GITHUB_REF_NAME" --notes-file scripts/release-notes.md

  # `targets` builds only what Ensayo ships (Mac Apple silicon and Windows x64); there is no Windows ARM64 installer yet,
  # so that helper is skipped. Same tag in `engine-ref` and after the @.
  helpers:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    uses: mmnzns/voice-engine/.github/workflows/build-helpers.yml@v0.3.1
    with:
      engine-ref: v0.3.1
      helpers: "llm,llm-vulkan"
      targets: "aarch64-apple-darwin,x86_64-pc-windows-msvc"
      llm-name: ensayo-llm

  windows:
    needs: [draft, helpers]
    if: github.event_name == 'push'
    permissions:
      contents: write
    runs-on: windows-latest
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-windows
      - run: npm ci
      # The AI helpers come from the engine's workflow (the `helpers` job): ensayo-llm-<triple>.exe and, on x64,
      # ensayo-llm-vulkan-<triple>.exe, where Tauri's externalBin expects them.
      - uses: actions/download-artifact@v4
        with:
          name: helpers-x86_64-pc-windows-msvc
          path: src-tauri/binaries
      - name: Check the helpers against SHA256SUMS
        shell: pwsh
        working-directory: src-tauri/binaries
        run: |
          foreach ($f in 'ensayo-llm-x86_64-pc-windows-msvc.exe', 'ensayo-llm-vulkan-x86_64-pc-windows-msvc.exe') {
            if (-not (Test-Path $f)) { Write-Error "$f is missing from the helpers artifact"; exit 1 }
          }
          foreach ($line in (Get-Content SHA256SUMS | Where-Object { $_.Trim() })) {
            $hash, $name = $line.Trim() -split '\s+\*?', 2
            $got = (Get-FileHash $name -Algorithm SHA256).Hash
            if ($got -ne $hash.ToUpper()) { Write-Error "checksum mismatch: $name"; exit 1 }
          }
          Get-Content build-info.txt
      # Release-only Tauri config, passed with --config: (1) the frontend-only beforeBuildCommand, so the in-repo helper
      # script cannot overwrite the helpers above; (2) the Vulkan sidecar in externalBin (the default config omits it so
      # a build without the Vulkan SDK still bundles; this job has checked that the file exists). Arrays replace, so
      # the processor helper is listed again.
      - name: Release Tauri config
        shell: pwsh
        run: |
          '{"build":{"beforeBuildCommand":"npm run build"},"bundle":{"externalBin":["binaries/ensayo-llm","binaries/ensayo-llm-vulkan"]}}' |
            Set-Content -Path "$env:RUNNER_TEMP/tauri.release.conf.json" -Encoding ascii
      # The app's own whisper.cpp must be built for the AVX2 baseline, not this runner's CPU. The signing key makes the
      # installer's .sig (tauri.conf.json: bundle.createUpdaterArtifacts). The helpers are not built here, so only the
      # app's whisper.cpp cache is left to check (Test-GgmlBaseline).
      - name: Build the installer
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          . ./scripts/cpu-baseline.ps1
          npm run tauri build -- --bundles nsis --config "$env:RUNNER_TEMP/tauri.release.conf.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $caches = @(Get-GgmlCaches src-tauri/target)
          if ($caches.Count -eq 0) { Write-Error "no whisper.cpp build found to check"; exit 1 }
          $bad = @($caches | ForEach-Object { Test-GgmlBaseline $_ })
          if ($bad.Count -gt 0) { Write-Error "whisper.cpp was not built for the baseline: $bad"; exit 1 }
      - name: Upload to the draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"; out=src-tauri/target/release/bundle/nsis
          gh release upload "$GITHUB_REF_NAME" --repo "$RELEASE_REPO" "$out/Ensayo_${v}_x64-setup.exe" "$out/Ensayo_${v}_x64-setup.exe.sig" --clobber

  macos:
    needs: [draft, helpers]
    if: github.event_name == 'push'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-latest is Apple silicon. No Intel entry: see the note at the top.
          - { os: macos-latest, target: aarch64-apple-darwin, arch: aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-${{ matrix.arch }}
      - run: npm ci
      # ensayo-llm-<triple> from the engine's workflow (the `helpers` job). Artifacts lose the executable bit.
      - uses: actions/download-artifact@v4
        with:
          name: helpers-${{ matrix.target }}
          path: src-tauri/binaries
      - name: Check the helper against SHA256SUMS and make it executable
        working-directory: src-tauri/binaries
        run: |
          test -f "ensayo-llm-${{ matrix.target }}" || { echo "::error::ensayo-llm-${{ matrix.target }} is missing from the helpers artifact"; exit 1; }
          shasum -a 256 -c SHA256SUMS
          chmod +x ./*-apple-darwin
          cat build-info.txt
      # Tauri's own certificate import cannot trust a self-signed certificate; Talaan needed this step too (three
      # failed CI runs). So the certificate goes into a temporary keychain first and Tauri only gets the name.
      - name: Signing certificate into a temporary keychain
        uses: ./.github/actions/mac-signing
        with:
          certificate: ${{ secrets.APPLE_CERTIFICATE }}
          password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          identity: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      - name: Build the app, the disk image and the updater package
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        # --config: the frontend-only beforeBuildCommand, so scripts/build-llm-helper.sh cannot replace the downloaded helper.
        # Tauri signs the sidecar inside the .app with this identity; check-mac-signature.sh (codesign --deep --strict) covers it.
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles app,dmg --config '{"build":{"beforeBuildCommand":"npm run build"}}'
      - name: Check the Mac signature
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: sh scripts/check-mac-signature.sh "src-tauri/target/${{ matrix.target }}/release/bundle/macos/Ensayo.app"
      - name: Upload to the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"; out="src-tauri/target/${{ matrix.target }}/release/bundle"
          # The package is Ensayo.app.tar.gz whatever the architecture: name it so the two Macs don't collide.
          cp "$out/macos/Ensayo.app.tar.gz" "$out/Ensayo_${v}_${{ matrix.arch }}.app.tar.gz"
          cp "$out/macos/Ensayo.app.tar.gz.sig" "$out/Ensayo_${v}_${{ matrix.arch }}.app.tar.gz.sig"
          gh release upload "$GITHUB_REF_NAME" --repo "$RELEASE_REPO" \
            "$out/dmg/Ensayo_${v}_${{ matrix.arch }}.dmg" \
            "$out/Ensayo_${v}_${{ matrix.arch }}.app.tar.gz" \
            "$out/Ensayo_${v}_${{ matrix.arch }}.app.tar.gz.sig" --clobber

  # After both builds: latest.json from every .sig on the draft (what the updater reads once it is published).
  updater-json:
    needs: [windows, macos]
    if: github.event_name == 'push'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/latest-json.check.mjs
      - env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/latest-json.mjs "$GITHUB_REF_NAME"

  # Run by hand (Actions, Release, Run workflow) to check that both installers build, without making a release. It
  # builds like the release jobs above (engine helpers, release-only --config), minus the draft and the upload.
  # Needs the signing secrets: the build makes updater signatures.
  test-build:
    needs: helpers
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: test-build-${{ matrix.os }}
      - run: npm ci
      # The AI helpers come from the engine's workflow (the `helpers` job), as in the release jobs. macos-latest is
      # Apple silicon.
      - uses: actions/download-artifact@v4
        with:
          name: ${{ runner.os == 'Windows' && 'helpers-x86_64-pc-windows-msvc' || 'helpers-aarch64-apple-darwin' }}
          path: src-tauri/binaries
      - name: Check the helpers against SHA256SUMS
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: src-tauri/binaries
        run: |
          foreach ($f in 'ensayo-llm-x86_64-pc-windows-msvc.exe', 'ensayo-llm-vulkan-x86_64-pc-windows-msvc.exe') {
            if (-not (Test-Path $f)) { Write-Error "$f is missing from the helpers artifact"; exit 1 }
          }
          foreach ($line in (Get-Content SHA256SUMS | Where-Object { $_.Trim() })) {
            $hash, $name = $line.Trim() -split '\s+\*?', 2
            $got = (Get-FileHash $name -Algorithm SHA256).Hash
            if ($got -ne $hash.ToUpper()) { Write-Error "checksum mismatch: $name"; exit 1 }
          }
          Get-Content build-info.txt
      - name: Check the helper against SHA256SUMS and make it executable
        if: runner.os == 'macOS'
        working-directory: src-tauri/binaries
        run: |
          test -f "ensayo-llm-aarch64-apple-darwin" || { echo "::error::ensayo-llm-aarch64-apple-darwin is missing from the helpers artifact"; exit 1; }
          shasum -a 256 -c SHA256SUMS
          chmod +x ./*-apple-darwin
          cat build-info.txt
      # Release-only Tauri config, as in the windows release job: the frontend-only beforeBuildCommand and the Vulkan
      # sidecar in externalBin.
      - name: Release Tauri config
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          '{"build":{"beforeBuildCommand":"npm run build"},"bundle":{"externalBin":["binaries/ensayo-llm","binaries/ensayo-llm-vulkan"]}}' |
            Set-Content -Path "$env:RUNNER_TEMP/tauri.release.conf.json" -Encoding ascii
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        # Only on Windows: on the Mac a Windows LLVM path stops bindgen finding libclang.
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        run: |
          . ./scripts/cpu-baseline.ps1
          npm run tauri build -- --bundles nsis --config "$env:RUNNER_TEMP/tauri.release.conf.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $caches = @(Get-GgmlCaches src-tauri/target)
          if ($caches.Count -eq 0) { Write-Error "no whisper.cpp build found to check"; exit 1 }
          $bad = @($caches | ForEach-Object { Test-GgmlBaseline $_ })
          if ($bad.Count -gt 0) { Write-Error "whisper.cpp was not built for the baseline: $bad"; exit 1 }
      - name: Signing certificate into a temporary keychain
        if: runner.os == 'macOS'
        uses: ./.github/actions/mac-signing
        with:
          certificate: ${{ secrets.APPLE_CERTIFICATE }}
          password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          identity: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      - name: Mac disk image
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        # --config: the frontend-only beforeBuildCommand, so scripts/build-llm-helper.sh cannot replace the downloaded helper.
        run: npm run tauri build -- --bundles app,dmg --config '{"build":{"beforeBuildCommand":"npm run build"}}'
      - name: Check the Mac signature
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: sh scripts/check-mac-signature.sh src-tauri/target/release/bundle/macos/Ensayo.app
      - uses: actions/upload-artifact@v4
        with:
          name: ensayo-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.tar.gz
            src-tauri/target/release/bundle/macos/*.sig
          if-no-files-found: error
