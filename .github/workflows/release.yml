name: Release

# Push a tag like v0.1.0 (it must match "version" in src-tauri/tauri.conf.json). This makes a draft GitHub Release with
#   Windows:  Ensayo_<v>_x64-setup.exe
#   Mac:      Ensayo_<v>_aarch64.dmg (Apple silicon)
# Publish the draft by hand after trying the installers (docs/RELEASE.md). Nothing here is signed with a paid
# certificate: testers get one-time steps in INSTALL.md. The automatic updater is not in v0 (it needs a key pair
# only Miguel can create; docs/RELEASE.md says how to add it).
#
# Optional secrets (macOS job): APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY.
# With them the Mac app keeps its microphone permission across updates; without them it is ad-hoc signed and macOS
# asks for the microphone again after each new version.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draft:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version matches the tag
        run: |
          want="${GITHUB_REF_NAME#v}"
          have=$(node -p "require('./src-tauri/tauri.conf.json').version")
          [ "$want" = "$have" ] || { echo "::error::tag $GITHUB_REF_NAME but tauri.conf.json says $have"; exit 1; }
      - name: Draft release for this tag (once)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Ensayo $GITHUB_REF_NAME" \
              --notes "First install: see [INSTALL.md](https://github.com/${{ github.repository }}/blob/$GITHUB_REF_NAME/INSTALL.md). Mac: open the .dmg, drag Ensayo to Applications, then right-click and Open once. Windows: run the setup file; if SmartScreen stops it, choose More info then Run anyway."

  windows:
    needs: draft
    if: github.event_name == 'push'
    runs-on: windows-latest
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-windows
      - run: npm ci
      # The built-in local AI helper must exist before the app builds (tauri.conf.json externalBin).
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-llm-helper.ps1
      # Whisper and llama.cpp must be built for the AVX2 baseline, not this runner's CPU.
      - name: Build the installer
        shell: pwsh
        run: |
          . ./scripts/cpu-baseline.ps1
          npm run tauri build -- --bundles nsis
          $bad = @(Get-GgmlCaches src-tauri/target | ForEach-Object { Test-GgmlBaseline $_ })
          if ($bad.Count -gt 0) { Write-Error "whisper.cpp or llama.cpp was not built for the baseline: $bad"; exit 1 }
      - name: Upload to the draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          gh release upload "$GITHUB_REF_NAME" "src-tauri/target/release/bundle/nsis/Ensayo_${v}_x64-setup.exe" --clobber

  macos:
    needs: draft
    if: github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-arm64
      - run: npm ci
      - name: Build the app and upload the .dmg to the draft
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseDraft: true
          args: --target aarch64-apple-darwin --bundles dmg

  # Run by hand (Actions, Release, Run workflow) to check that both installers build, without making a release.
  test-build:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: test-build-${{ matrix.os }}
      - run: npm ci
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/build-llm-helper.ps1
          . ./scripts/cpu-baseline.ps1
          npm run tauri build -- --bundles nsis
      - name: Mac disk image
        if: runner.os == 'macOS'
        run: npm run tauri build -- --bundles dmg
      - uses: actions/upload-artifact@v4
        with:
          name: ensayo-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
