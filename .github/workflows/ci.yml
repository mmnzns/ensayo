name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: node --test scripts/latest-json.check.mjs
      - run: npm run build
      # The app's build needs the helper in src-tauri/binaries (tauri.conf.json externalBin), so it comes first.
      - run: sh scripts/build-llm-helper.sh
      - run: cargo test --manifest-path src-tauri/Cargo.toml --workspace

  windows:
    runs-on: windows-latest
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: npm run build
      # The app's build needs the helper in src-tauri/binaries (tauri.conf.json externalBin), so it comes first.
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-llm-helper.ps1
      - name: Whisper and llama.cpp must be built for the AVX2 baseline, not this runner's CPU
        shell: pwsh
        run: |
          . ./scripts/cpu-baseline.ps1
          # ONNX Runtime's build step copies its DLLs (onnxruntime.dll, DirectML.dll) next to the app only, not into
          # deps where the test programs run, when it can't symlink across drives; the test program then loads
          # Windows' older DirectML.dll and stops with STATUS_ENTRYPOINT_NOT_FOUND. Build, put the DLLs beside the tests, run.
          cargo test --release --manifest-path src-tauri/Cargo.toml --workspace --no-run
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem src-tauri/target/release -Filter *.dll | ForEach-Object { Write-Host "copying $($_.Name) beside the tests"; Copy-Item $_.FullName src-tauri/target/release/deps -Force }
          cargo test --release --manifest-path src-tauri/Cargo.toml --workspace
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $bad = @(Get-GgmlCaches src-tauri/target | ForEach-Object { Test-GgmlBaseline $_ })
          if ($bad.Count -gt 0) { Write-Error "whisper.cpp or llama.cpp was not built for the baseline: $bad"; exit 1 }
