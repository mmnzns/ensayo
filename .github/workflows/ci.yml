name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      # A runner image CMake upgrade must not reuse a cached build dir that points at the old install.
      - name: Read CMake version
        id: cmake
        shell: bash
        run: echo "version=$(cmake --version | head -n 1)" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: cmake-${{ steps.cmake.outputs.version }}
      - run: npm ci
      - run: npm test
      - run: node --test scripts/latest-json.check.mjs
      - run: npm run build
      # The app's build needs the helper in src-tauri/binaries (tauri.conf.json externalBin), so it comes first.
      - run: sh scripts/build-llm-helper.sh
      - run: cargo test --manifest-path src-tauri/Cargo.toml --workspace

  windows:
    runs-on: windows-latest
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      # A runner image CMake upgrade must not reuse a cached build dir that points at the old install.
      - name: Read CMake version
        id: cmake
        shell: pwsh
        run: |
          $v = (cmake --version | Select-Object -First 1).Trim()
          "version=$v" >> $env:GITHUB_OUTPUT
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: cmake-${{ steps.cmake.outputs.version }}
      - run: npm ci
      - run: npm test
      - run: npm run build
      # The app's build needs the helper in src-tauri/binaries (tauri.conf.json externalBin), so it comes first.
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-llm-helper.ps1
      - name: Whisper and llama.cpp must be built for the AVX2 baseline, not this runner's CPU
        shell: pwsh
        run: |
          . ./scripts/cpu-baseline.ps1
          # The test programs have no application manifest, so Windows gives them the old common controls, which lack
          # TaskDialogIndirect (pulled in by Tauri), and on this runner image (2026-11-03) they stop at start with
          # STATUS_ENTRYPOINT_NOT_FOUND. The app itself carries Tauri's manifest. Build the tests, give each the
          # common-controls manifest with mt.exe, then run them.
          cargo test --release --manifest-path src-tauri/Cargo.toml --workspace --no-run
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # Rust 1.100 puts the test programs under target/release/build/<crate>/<hash>/out, not deps, so search the whole
          # release folder, and fail if none are found rather than pass without running a test.
          $testExes = @(Get-ChildItem src-tauri/target/release -Recurse -Filter *.exe | Where-Object { $_.Name -match '^(ensayo_lib|ensayo|ensayo_eval|ensayo_llm|process)-[0-9a-f]+\.exe$' })
          if ($testExes.Count -eq 0) { Write-Error 'no test programs found'; exit 1 }
          $manifest = Join-Path $env:RUNNER_TEMP 'tests.manifest'
          Set-Content -Path $manifest -Encoding ascii -Value '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><assembly xmlns="urn:schemas-microsoft-com:asm.v1" manifestVersion="1.0"><dependency><dependentAssembly><assemblyIdentity type="win32" name="Microsoft.Windows.Common-Controls" version="6.0.0.0" processorArchitecture="*" publicKeyToken="6595b64144ccf1df" language="*"/></dependentAssembly></dependency></assembly>'
          $mt = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter mt.exe | Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          Get-ChildItem src-tauri/target/release -Recurse -Filter *.exe | Where-Object { $_.Name -match '^(ensayo_lib|ensayo|ensayo_eval|ensayo_llm|process)-[0-9a-f]+\.exe$' } | ForEach-Object {
            & $mt.FullName -nologo -manifest $manifest "-outputresource:$($_.FullName);#1"
            if ($LASTEXITCODE -ne 0) { Write-Error "mt.exe failed on $($_.Name)"; exit 1 }
          }
          # Run them directly: a second `cargo test` relinks them and drops the manifest. Each runs from its own crate.
          Get-ChildItem src-tauri/target/release -Recurse -Filter *.exe | Where-Object { $_.Name -match '^(ensayo_lib|ensayo|ensayo_eval|ensayo_llm|process)-[0-9a-f]+\.exe$' } | ForEach-Object {
            $crate = if ($_.Name -like 'ensayo_llm-*') { 'src-tauri/llm' } else { 'src-tauri' }
            $env:CARGO_MANIFEST_DIR = (Resolve-Path $crate).Path
            Write-Host "running $($_.Name)"
            Push-Location $crate
            & $_.FullName
            $code = $LASTEXITCODE
            Pop-Location
            if ($code -ne 0) { Write-Error "$($_.Name) failed ($code)"; exit 1 }
          }
          $caches = @(Get-GgmlCaches src-tauri/target)
          $whisper = @($caches | Where-Object { $_ -match 'whisper-rs-sys' })
          Write-Host "baseline check: $($caches.Count) ggml cache(s), $($whisper.Count) of them whisper.cpp"
          if ($whisper.Count -eq 0) { Write-Error 'no whisper.cpp build found to check'; exit 1 }
          $bad = @($caches | ForEach-Object { Test-GgmlBaseline $_ })
          if ($bad.Count -gt 0) { Write-Error "whisper.cpp or llama.cpp was not built for the baseline: $bad"; exit 1 }
