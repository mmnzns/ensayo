name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: npm run build
      # The app's build needs the helper in src-tauri/binaries (tauri.conf.json externalBin), so it comes first.
      - run: sh scripts/build-llm-helper.sh
      - run: cargo test --manifest-path src-tauri/Cargo.toml --workspace

  windows:
    runs-on: windows-latest
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: npm run build
      # The app's build needs the helper in src-tauri/binaries (tauri.conf.json externalBin), so it comes first.
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-llm-helper.ps1
      - name: Whisper and llama.cpp must be built for the AVX2 baseline, not this runner's CPU
        shell: pwsh
        run: |
          . ./scripts/cpu-baseline.ps1
          cargo test --release --manifest-path src-tauri/Cargo.toml --workspace
          $bad = @(Get-GgmlCaches src-tauri/target | ForEach-Object { Test-GgmlBaseline $_ })
          if ($bad.Count -gt 0) { Write-Error "whisper.cpp or llama.cpp was not built for the baseline: $bad"; exit 1 }
