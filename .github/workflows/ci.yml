name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: node --test scripts/latest-json.check.mjs
      - run: npm run build
      # The app's build needs the helper in src-tauri/binaries (tauri.conf.json externalBin), so it comes first.
      - run: sh scripts/build-llm-helper.sh
      - run: cargo test --manifest-path src-tauri/Cargo.toml --workspace

  windows:
    runs-on: windows-latest
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: npm run build
      # The app's build needs the helper in src-tauri/binaries (tauri.conf.json externalBin), so it comes first.
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-llm-helper.ps1
      - name: Whisper and llama.cpp must be built for the AVX2 baseline, not this runner's CPU
        shell: pwsh
        run: |
          . ./scripts/cpu-baseline.ps1
          # Tests in debug, like Talaan's CI: the release test program stops at start on this runner image
          # (STATUS_ENTRYPOINT_NOT_FOUND, 2026-11-14) though the release app builds. The release build stays, for the
          # baseline check below.
          cargo test --manifest-path src-tauri/Cargo.toml --workspace
          if ($LASTEXITCODE -ne 0) {
            # Which DLLs the test program needs and where each would load from (diagnosis for STATUS_ENTRYPOINT_NOT_FOUND).
            $exe = Get-ChildItem src-tauri/target/debug/deps -Filter 'ensayo_lib-*.exe' | Select-Object -First 1
            $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
            $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe | Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
            & $dumpbin.FullName /dependents $exe.FullName
            Get-ChildItem src-tauri/target/debug/deps -Filter *.dll | ForEach-Object { "{0} -> {1} ({2})" -f $_.Name, $_.Target, $_.Length }
            Get-Item C:\Windows\System32\DirectML.dll -ErrorAction SilentlyContinue | ForEach-Object { "System32 DirectML.dll " + $_.VersionInfo.FileVersion }
            exit 1
          }
          cargo build --release --manifest-path src-tauri/Cargo.toml --workspace
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $bad = @(Get-GgmlCaches src-tauri/target | ForEach-Object { Test-GgmlBaseline $_ })
          if ($bad.Count -gt 0) { Write-Error "whisper.cpp or llama.cpp was not built for the baseline: $bad"; exit 1 }
