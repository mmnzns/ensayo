[package]
name = "ensayo-llm"
version = "0.1.4"
description = "Ensayo's built-in local AI helper: runs llama.cpp in its own process"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
ensayo-llm-protocol = { path = "../llm-protocol" }
serde_json = "1"
llama-cpp-2 = { version = "=0.1.159", default-features = false, features = ["common"] }

# Windows asks for the physical core count to size llama.cpp's threads.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_System_SystemInformation"] }

# The Mac build runs the model on the Apple GPU (Metal). Windows is the processor build only in v0.
[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { version = "=0.1.159", default-features = false, features = ["metal", "common"] }
