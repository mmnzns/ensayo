[package]
name = "ensayo-llm"
version = "0.1.4"
description = "Ensayo's built-in local AI helper: the engine's llama.cpp helper, in its own process"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
voice-engine-llm = { git = "https://github.com/mmnzns/voice-engine", tag = "v0.2.2" }
voice-engine-protocol = { git = "https://github.com/mmnzns/voice-engine", tag = "v0.2.2" }

[features]
# Windows graphics-card build of the helper (shipped next to the processor one).
vulkan = ["voice-engine-llm/vulkan"]
