[package]
name = "ensayo"
version = "0.1.4"
description = "Interview rehearsal app"
authors = ["Miguel Monzones"]
license = "MIT"
edition = "2024"
default-run = "ensayo"

[lib]
name = "ensayo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The built-in local AI runs in its own helper process (llm/, the engine's helper): llama.cpp and whisper.cpp each
# bundle ggml and must never share a process. `cargo test` at this folder tests every member.
[workspace]
members = [".", "llm"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2.0.21"
chrono = { version = "0.4.45", features = ["serde"] }
gethostname = "1"
dirs = "7.0.0"
log = "0.4.34"
cpal = "0.18.2"
rtrb = "0.4.0"
rubato = "5.0.1"
hound = "3.5.1"
# Speech, the model folder and the AI helper client come from the shared engine; every engine crate uses one tag.
voice-engine-protocol = { git = "https://github.com/mmnzns/voice-engine", tag = "v0.2.3" }
voice-engine-stt = { git = "https://github.com/mmnzns/voice-engine", tag = "v0.2.3" }
voice-engine-models = { git = "https://github.com/mmnzns/voice-engine", tag = "v0.2.3" }
voice-engine-client = { git = "https://github.com/mmnzns/voice-engine", tag = "v0.2.3" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json"] }
sha2 = "0.10.9"
tokio = { version = "1", features = ["rt", "time", "macros"] }
keyring = "3.6.3"
jsonschema = { version = "0.30", default-features = false }
tauri-plugin-opener = "2.7.2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
pdf-extract = "0.12.1"
docx-rs = "0.4.22"
# Backup and restore. Deflate through flate2 (pure Rust miniz_oxide): no C toolchain, no extra codecs.
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
tempfile = "3.27.0"
tiny_http = "0.12.0"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }
objc2 = "0.6.5"
objc2-av-foundation = "0.3.2"
objc2-foundation = "0.3.2"
block2 = "0.6.2"

[target.'cfg(target_os = "windows")'.dependencies]
# DirectML runs Parakeet on a discrete graphics card.
voice-engine-stt = { git = "https://github.com/mmnzns/voice-engine", tag = "v0.2.3", features = ["directml"] }
keyring = { version = "3.6.3", features = ["windows-native"] }
winreg = "0.56.0"
# In-process system voices (Windows.Media.SpeechSynthesis, the OneCore voices) and the free-disk question; the version is
# the one tauri already builds.
windows = { version = "0.62", features = ["Foundation", "Foundation_Collections", "Media_Core", "Media_Playback", "Media_SpeechSynthesis", "Storage_Streams", "Win32_System_Com", "Win32_Storage_FileSystem"] }
# macOS already keeps one copy of an app running; Windows starts another on every Start-menu click.
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = false
opt-level = 3
strip = true

# Dependencies are always optimized, even in debug builds: whisper.cpp (built through CMake, which follows
# opt-level) and the audio math are 10x+ slower unoptimized. Ensayo's own code stays fast to compile.
[profile.dev.package."*"]
opt-level = 3
